name: monitor_1c
description: Мультиплатформенный монитор ошибок 1С (Android/iOS/Desktop) — Flutter + Supabase + FCM
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # State / DI (skill: ViewModel = ChangeNotifier, DI через provider)
  provider: ^6.1.2
  # Arch: freezed domain models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Backend
  supabase_flutter: ^2.8.1
  # Push / local notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  # Local cache (last_seen_id, offline queue)
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0
  # Utils
  intl: ^0.20.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
