# supabase/config.toml — минимальный конфиг для локальной разработки
# См. https://supabase.com/docs/guides/local-development/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54325
file_size_limit = "50MiB"
import_path = "./storage"

[auth]
enabled = true
port = 54325
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false
enable_manual_linking = true
third_party_auth = { enabled = false }
email_auth = true
external_anonymous_users_enabled = true

[auth.external.google]
enabled = false

# Edge Functions
[functions.watcher]
enabled = true
verify_jwt = false  # Database Webhooks шлют без JWT, проверяем service_role внутри
import_map = "./functions/watcher/import_map.json"
entrypoint = "./functions/watcher/index.ts"

[analytics]
enabled = false
port = 54327
vector_port = 54328
